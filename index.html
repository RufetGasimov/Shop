<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beans - Dune Flame</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container main-container py-5">
        
        <h1 class="page-title mb-2">Beans</h1>
        <p class="page-subtitle mb-4">Discover our carefully curated selection</p>

        <div class="category-pills d-flex flex-wrap gap-2 mb-4">
            <button class="btn pill-btn">Explore the shop</button>
            <button class="btn pill-btn active">Coffee</button>
            <button class="btn pill-btn">Cascara</button>
            <button class="btn pill-btn">Equipment</button>
        </div>

        <hr class="section-divider mb-4">

        <div class="mb-4">
            <input type="text" id="search-input" class="form-control custom-search-bar" placeholder="Search coffee...">
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <button class="btn filter-toggle-btn" type="button" data-bs-toggle="collapse" data-bs-target="#filterPanel">
                Filters <span class="ms-1">v</span>
            </button>

            <div class="showing-count">
                Showing <strong id="showing-count">8</strong> of <strong id="total-count">16</strong> coffee
            </div>

            <div class="sort-wrapper">
                <select id="sort-select" class="form-select custom-sort-select">
                    <option value="default">SORT BY: DEFAULT</option>
                    <option value="low-high">PRICE: LOW TO HIGH</option>
                    <option value="high-low">PRICE: HIGH TO LOW</option>
                </select>
            </div>
        </div>

        <div class="collapse mb-4" id="filterPanel">
            <div class="filter-box p-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="inStockOnly">
                    <label class="form-check-label small" for="inStockOnly">In Stock Only</label>
                </div>
            </div>
        </div>

        <div id="product-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
